<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #121212;
      color: #eaeaea;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 320px;
      padding: 32px 24px;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      background: #181818;
    }
    .icon {
      font-size: 36px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #888;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⏳</div>
    <h1>Эта страница пока спит</h1>
    <p>Кажется, ты открыла её чуть раньше времени. Загляни сюда немного позже ✨</p>
  </div>
</body>
</html>
